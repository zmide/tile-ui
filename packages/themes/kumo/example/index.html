<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="A Vue + TSX playground for Tile UI and the Kumo theme. Explore forms, data, overlays, and light and dark modes." />
		<title>Kumo Playground · Tile UI</title>
		<script>
			try {
				const mode = localStorage.getItem('kumo-example-mode');
				if (mode === 'dark' || mode === 'light') document.documentElement.dataset.theme = mode;
			} catch {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
